server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  event:
    url: ${EVENT_SERVICE_URL:http://localhost:8082}
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}


management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enable: true